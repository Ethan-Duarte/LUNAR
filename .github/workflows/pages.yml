name: Test and publish LUNAR
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lunar-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_LUNAR_STATIC: 'true'
      - name: Read stable source for preview deployments
        if: github.ref == 'refs/heads/next' && github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable
      - name: Build unchanged stable viewer
        if: github.ref == 'refs/heads/next' && github.event_name != 'pull_request'
        working-directory: stable/frontend
        env:
          VITE_LUNAR_STATIC: 'true'
        run: |
          npm ci
          npm run build
      - name: Assemble website
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p site
          if [ "$GITHUB_REF_NAME" = next ]; then
            cp -a stable/frontend/dist/. site/
            mkdir -p site/preview
            cp -a frontend/dist/. site/preview/
          else
            cp -a frontend/dist/. site/
          fi
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
